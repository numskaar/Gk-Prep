<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GK Quiz — GK Prep</title>
<link rel="stylesheet" href="style.css">
<style>
.answer-review{margin-top:14px;padding:14px;border-radius:10px;background:#f7f7f7;border:1px solid #ddd}
.answer-review.correct{border-left:4px solid #198754}
.answer-review.wrong{border-left:4px solid #dc3545}
.answer-review p{margin:7px 0}
.correct-text{font-weight:700}
</style>
</head>
<body>
<header class="site-header"><div class="wrap header-row"><a href="index.html" class="logo">GK<span>Prep</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="index.html">Current affairs</a><a href="quiz.html" class="active">Quiz</a><a href="index.html">GK questions</a><a href="index.html">E-books</a></nav><div class="header-actions"><a href="index.html" class="login-link">Login</a><button class="menu-toggle" aria-label="Open menu">☰</button></div></div></header>

<main class="page-body"><div class="wrap"><section class="quiz-shell">
<div class="quiz-head"><p class="section-label">GK Prep</p><h1>GK Questions Quiz</h1><p>Admin Panel से जो questions publish होंगे, वे यहाँ automatically दिखाई देंगे।</p><div id="status">Questions loading...</div></div>
<div id="quizBox"></div>
<button id="submitQuiz" class="btn btn-primary" style="margin-top:18px;display:none">Submit Quiz</button>
<div id="result" style="margin-top:20px"></div>
</section></div></main>

<script src="config.js"></script>
<script>
let questions=[];
const statusEl=document.getElementById('status');
const quizBox=document.getElementById('quizBox');
const submitBtn=document.getElementById('submitQuiz');
const result=document.getElementById('result');

const sb=document.createElement('script');
sb.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
sb.onload=loadQuestions;
sb.onerror=()=>statusEl.textContent='Quiz service load नहीं हो पाई।';
document.head.appendChild(sb);

async function loadQuestions(){
  const c=supabase.createClient(GK_CONFIG.SUPABASE_URL,GK_CONFIG.SUPABASE_ANON_KEY);
  const {data,error}=await c.from('gk_questions').select('*').eq('published',true).order('created_at',{ascending:false});
  if(error){console.error(error);statusEl.textContent='Questions load नहीं हो पाए।';return;}
  questions=data||[];
  if(!questions.length){statusEl.textContent='अभी कोई published GK question नहीं है।';return;}
  statusEl.textContent=`Total Questions: ${questions.length}`;
  renderQuestions();
  submitBtn.style.display='inline-block';
}

function renderQuestions(){
  quizBox.innerHTML=questions.map((q,i)=>`
    <div class="quiz-question" id="question-${i}" style="margin:22px 0;padding:20px;border:1px solid #ddd;border-radius:12px">
      <h3>Q${i+1}. ${esc(q.question)}</h3>
      ${[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(([k,v])=>`
        <label style="display:block;margin:10px 0"><input type="radio" name="q${i}" value="${k}"> ${k}. ${esc(v)}</label>
      `).join('')}
      <div class="answer-review" id="review-${i}" style="display:none"></div>
    </div>
  `).join('');
}

submitBtn.onclick=()=>{
  let score=0;
  let answered=0;

  questions.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    const review=document.getElementById(`review-${i}`);
    const card=document.getElementById(`question-${i}`);
    const correctLetter=q.correct_option;
    const correctAnswer=getOptionText(q,correctLetter);
    const selectedLetter=selected ? selected.value : '';
    const selectedAnswer=selected ? getOptionText(q,selectedLetter) : 'कोई उत्तर नहीं चुना';
    const isCorrect=selectedLetter===correctLetter;

    if(selected) answered++;
    if(isCorrect) score++;

    review.style.display='block';
    review.className='answer-review '+(isCorrect?'correct':'wrong');
    review.innerHTML=`
      <p><strong>${isCorrect?'✅ सही उत्तर':'❌ गलत उत्तर'}</strong></p>
      <p>आपका उत्तर: <strong>${selectedLetter ? selectedLetter+'. '+esc(selectedAnswer) : esc(selectedAnswer)}</strong></p>
      <p class="correct-text">सही उत्तर: ${esc(correctLetter)}. ${esc(correctAnswer)}</p>
      ${q.explanation ? `<p><strong>व्याख्या:</strong> ${esc(q.explanation)}</p>` : ''}
    `;
    card.scrollIntoView({behavior:'smooth',block:'center'});
  });

  result.innerHTML=`<div class="side-card"><h2>आपका Score: ${score} / ${questions.length}</h2><p>Attempt किए गए प्रश्न: ${answered} / ${questions.length}</p><p>हर प्रश्न के नीचे अब <strong>सही उत्तर और Explanation</strong> दिखाई दे रहा है।</p></div>`;
  result.scrollIntoView({behavior:'smooth',block:'start'});
};

function getOptionText(q,key){
  return ({A:q.option_a,B:q.option_b,C:q.option_c,D:q.option_d})[key] || '';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;"}[m]));}
</script>
</body>
</html>

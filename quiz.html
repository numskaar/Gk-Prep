<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GK Quiz — GK Prep</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="wrap header-row"><a href="index.html" class="logo">GK<span>Prep</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="index.html">Current affairs</a><a href="quiz.html" class="active">Quiz</a><a href="index.html">GK questions</a><a href="index.html">E-books</a></nav><div class="header-actions"><a href="index.html" class="login-link">Login</a><button class="menu-toggle" aria-label="Open menu">☰</button></div></div></header>
<main class="page-body"><div class="wrap"><section class="quiz-shell"><div class="quiz-head"><p class="section-label">GK Prep</p><h1>GK Questions Quiz</h1><p>Admin Panel से जो questions publish होंगे, वे यहाँ automatically दिखाई देंगे।</p><div id="status">Questions loading...</div></div><div id="quizBox"></div><button id="submitQuiz" class="btn btn-primary" style="margin-top:18px;display:none">Submit Quiz</button><div id="result" style="margin-top:20px"></div></section></div></main>
<script src="config.js"></script><script>
const sb=document.createElement('script');sb.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sb.onload=loadQuestions;document.head.appendChild(sb);let questions=[];
async function loadQuestions(){const c=supabase.createClient(GK_CONFIG.SUPABASE_URL,GK_CONFIG.SUPABASE_ANON_KEY);const {data,error}=await c.from('gk_questions').select('*').eq('published',true).order('created_at',{ascending:false});if(error){status.textContent='Questions load नहीं हो पाए।';return}questions=data||[];if(!questions.length){status.textContent='अभी कोई published GK question नहीं है।';return}status.textContent=`Total Questions: ${questions.length}`;quizBox.innerHTML=questions.map((q,i)=>`<div class="quiz-question" style="margin:22px 0;padding:20px;border:1px solid #ddd;border-radius:12px"><h3>Q${i+1}. ${esc(q.question)}</h3>${[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(([k,v])=>`<label style="display:block;margin:10px 0"><input type="radio" name="q${i}" value="${k}"> ${k}. ${esc(v)}</label>`).join('')}</div>`).join('');submitQuiz.style.display='inline-block'}
submitQuiz.onclick=()=>{let score=0;questions.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===q.correct_option)score++});result.innerHTML=`<div class="side-card"><h2>आपका Score: ${score} / ${questions.length}</h2><p>Quiz complete हो गया। फिर से attempt करने के लिए answers बदलकर Submit Quiz दबाएँ।</p></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
